name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  native:
    name: Native
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test
        run: cargo test --all

  wasm:
    name: WASM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Check library for browser target
        run: cargo check --lib --target wasm32-unknown-unknown
