name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.87
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Formatting
        run: |
          rustfmt --edition 2018 --check \
            examples/visual_smoke.rs \
            src/render.rs \
            src/render/auto.rs \
            src/render/svg.rs \
            src/render/webgpu.rs \
            src/scene.rs \
            tests/scene.rs

      - name: ReX font provenance
        run: |
          test "$(git hash-object rex-xits.otf)" = "386d595c9eee71a85bc95e52fa76377dbb741843"

      - name: Compile all core targets and features
        run: cargo check -p rex --all-targets --all-features

      - name: Clippy
        run: cargo clippy -p rex --all-targets --all-features

      - name: Tests
        run: cargo test -p rex --all-features

      - name: SVG-only fallback tests
        run: cargo test -p rex --no-default-features

      - name: WebAssembly compile
        run: cargo check -p rex --target wasm32-unknown-unknown --all-features

  web-demo:
    name: Web demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.87
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Web adapter formatting
        run: rustfmt --edition 2018 --check web/src/application.rs web/src/infrastructure.rs web/src/lib.rs

      - name: Web adapter Clippy
        run: cargo clippy -p rex-web --all-targets

      - name: Web adapter tests
        run: cargo test -p rex-web

      - name: Web adapter browser compile
        run: cargo check -p rex-web --target wasm32-unknown-unknown

      - name: JavaScript syntax
        run: |
          node --check demo/app.js
          node --check demo/controller.js
          node --check demo/controller.test.js
          node --check demo/renderer.js
          node --check demo/renderer.test.js
          node --check demo/view.js

      - name: Browser adapter tests
        run: node --test demo/controller.test.js demo/renderer.test.js
