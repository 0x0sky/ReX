name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.87
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Formatting
        run: |
          rustfmt --edition 2018 --check \
            examples/visual_smoke.rs \
            src/render.rs \
            src/render/auto.rs \
            src/render/svg.rs \
            src/render/webgpu.rs \
            src/scene.rs \
            tests/scene.rs

      - name: ReX font provenance
        run: |
          test "$(git hash-object rex-xits.otf)" = "386d595c9eee71a85bc95e52fa76377dbb741843"

      - name: Compile all targets and features
        run: cargo check --all-targets --all-features

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      - name: Tests
        run: cargo test --all-features

      - name: SVG-only fallback tests
        run: cargo test --no-default-features

      - name: WebAssembly compile
        run: cargo check --target wasm32-unknown-unknown --all-features
